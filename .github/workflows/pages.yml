name: Deploy call graph to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Resolve NBS ref
        id: nbs-ref
        env:
          GH_TOKEN: ${{ github.token }}
          NBS_REF: ${{ vars.NBS_REF }}
        run: |
          if [ -n "$NBS_REF" ]; then
            REF="$NBS_REF"
          else
            REF="$(gh api repos/OpenNBS/NoteBlockStudio/releases/latest --jq .tag_name)"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using NoteBlockStudio ref: $REF"

      - name: Checkout NoteBlockStudio
        uses: actions/checkout@v4
        with:
          repository: OpenNBS/NoteBlockStudio
          ref: ${{ steps.nbs-ref.outputs.ref }}
          path: NoteBlockStudio

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Collect call graph
        run: uv run python collect.py --root NoteBlockStudio

      - name: Plot interactive site
        run: uv run python plot.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
